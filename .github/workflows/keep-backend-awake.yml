name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            https://hospital-ehr-backend-free.onrender.com/api/health/
