envVarGroups:
  - name: hospital-ehr-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: DJANGO_CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://.*\\.onrender\\.com$,^https://.*\\.vercel\\.app$
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://*.vercel.app,http://localhost:3000
      - key: DB_ENGINE
        value: postgresql
      - key: POSTGRES_SSLMODE
        value: require
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

services:
  - type: web
    name: hospital-ehr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - fromGroup: hospital-ehr-shared
      - key: POSTGRES_DB
        fromDatabase:
          name: hospital-ehr-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: hospital-ehr-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: hospital-ehr-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: hospital-ehr-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: hospital-ehr-db
          property: port
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString

  - type: worker
    name: hospital-ehr-celery-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=4
    envVars:
      - fromGroup: hospital-ehr-shared
      - key: POSTGRES_DB
        fromDatabase:
          name: hospital-ehr-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: hospital-ehr-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: hospital-ehr-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: hospital-ehr-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: hospital-ehr-db
          property: port
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString

  - type: worker
    name: hospital-ehr-celery-beat
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info
    envVars:
      - fromGroup: hospital-ehr-shared
      - key: POSTGRES_DB
        fromDatabase:
          name: hospital-ehr-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: hospital-ehr-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: hospital-ehr-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: hospital-ehr-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: hospital-ehr-db
          property: port
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hospital-ehr-redis
          property: connectionString

  - type: web
    name: hospital-ehr-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: sh -c 'export BACKEND_URL=\"http://$INTERNAL_BACKEND_HOSTPORT\" && npm run start -- --hostname 0.0.0.0 --port $PORT'
    envVars:
      - key: INTERNAL_BACKEND_HOSTPORT
        fromService:
          type: web
          name: hospital-ehr-backend
          property: hostport

  - type: keyvalue
    name: hospital-ehr-redis
    ipAllowList: []

databases:
  - name: hospital-ehr-db
    databaseName: hospital_ehr
    user: ehr_user
