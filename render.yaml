envVarGroups:
  - name: hospital-ehr-free-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: DJANGO_CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://.*\\.vercel\\.app$
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000
      - key: DB_ENGINE
        value: postgresql
      - key: POSTGRES_SSLMODE
        value: require
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: APPOINTMENT_REMINDER_INLINE_MODE
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: APPOINTMENT_CRON_SECRET
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

services:
  - type: web
    name: hospital-ehr-backend-free
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_free_demo
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health/
    envVars:
      - fromGroup: hospital-ehr-free-shared
      - key: POSTGRES_DB
        fromDatabase:
          name: hospital-ehr-db-free
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: hospital-ehr-db-free
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: hospital-ehr-db-free
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: hospital-ehr-db-free
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: hospital-ehr-db-free
          property: port

databases:
  - name: hospital-ehr-db-free
    plan: free
    databaseName: hospital_ehr
    user: ehr_user
